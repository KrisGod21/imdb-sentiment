<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentiment Classifier</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #6c8cff;
    --positive: #3fb97f;
    --negative: #e5556a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
  textarea {
    width: 100%;
    min-height: 140px;
    background: #0d0f13;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 0.95rem;
    resize: vertical;
    font-family: inherit;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  input[type="file"] { color: var(--muted); font-size: 0.85rem; flex: 1; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result {
    margin-top: 22px;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    display: none;
  }
  #result.show { display: block; }
  .label { font-size: 1.1rem; font-weight: 700; text-transform: capitalize; }
  .label.positive { color: var(--positive); }
  .label.negative { color: var(--negative); }
  .confidence { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .error { color: var(--negative); font-size: 0.85rem; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Sentiment Classifier</h1>
    <p class="sub">Paste text or upload a .txt file to see whether it reads positive or negative.</p>

    <textarea id="textInput" placeholder="Type or paste text here..."></textarea>

    <div class="row">
      <input type="file" id="fileInput" accept=".txt">
      <button id="submitBtn">Analyze</button>
    </div>

    <div class="error" id="errorMsg"></div>

    <div id="result">
      <div class="label" id="resultLabel"></div>
      <div class="confidence" id="resultConfidence"></div>
    </div>
  </div>

<script>
  // Point this at your deployed backend URL once it's live.
  // If the frontend is served from the same origin as the API (recommended
  // setup below), leave this as an empty string.
  const API_BASE = "";

  const textInput = document.getElementById("textInput");
  const fileInput = document.getElementById("fileInput");
  const submitBtn = document.getElementById("submitBtn");
  const errorMsg = document.getElementById("errorMsg");
  const result = document.getElementById("result");
  const resultLabel = document.getElementById("resultLabel");
  const resultConfidence = document.getElementById("resultConfidence");

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (file) {
      textInput.value = await file.text();
    }
  });

  submitBtn.addEventListener("click", async () => {
    const text = textInput.value.trim();
    errorMsg.textContent = "";
    result.classList.remove("show");

    if (!text) {
      errorMsg.textContent = "Please enter or upload some text.";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Analyzing...";

    try {
      const res = await fetch(`${API_BASE}/predict`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Something went wrong");
      }

      const data = await res.json();
      resultLabel.textContent = data.label;
      resultLabel.className = "label " + data.label.toLowerCase();
      resultConfidence.textContent = `${(data.confidence * 100).toFixed(1)}% confidence`;
      result.classList.add("show");
    } catch (e) {
      errorMsg.textContent = e.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Analyze";
    }
  });
</script>
</body>
</html>
